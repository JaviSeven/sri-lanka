<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sri Lanka 2026</title>
<meta name="description" content="Nuestro viaje a Sri Lanka, del 1 al 15 de noviembre de 2026">
<meta name="theme-color" content="#0E1A14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sri Lanka">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{
  --bg:#0E1A14; --bg2:#122219; --card:#15271D; --card2:#1B3226; --line:rgba(232,185,106,.13); --line2:rgba(168,196,160,.14);
  --tx:#F2E8D5; --mu:#A8C4A0; --mu2:#7E9A82; --gold:#C8973A; --gold2:#E8B96A; --ok:#7FCB95; --warn:#E8B96A; --bad:#E07A55; --blue:#6FB7D6;
  --r:22px; --sh:0 10px 30px rgba(0,0,0,.28);
  --serif:'Playfair Display',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.45;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(ellipse at 20% 0%,rgba(200,151,58,.10),transparent 55%),radial-gradient(ellipse at 90% 30%,rgba(42,107,138,.08),transparent 50%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx)}
a{color:var(--gold2);text-decoration:none}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

/* Cabecera */
header.top{position:sticky;top:0;z-index:20;background:rgba(14,26,20,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;gap:12px;padding:12px 16px 10px;max-width:640px;margin:0 auto}
.logo{width:44px;height:44px;border-radius:13px;flex:none;box-shadow:0 0 0 1px var(--line)}
.hd h1{font-family:var(--serif);font-weight:700;font-size:1.32rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px;line-height:1.1}
.hd h1 em{color:var(--gold2);font-style:italic;font-weight:400}
.hd .sub{color:var(--mu);font-size:.8rem;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--sans);font-size:.68rem;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(200,151,58,.16);color:var(--gold2);border:1px solid rgba(200,151,58,.3);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;max-width:640px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 15px;border-radius:12px;border:1px solid var(--c,var(--line));color:var(--c,var(--tx));font-weight:600;font-size:.86rem;background:transparent;transition:.15s}
.chip.on{background:var(--c);color:#0E1A14;border-color:var(--c)}

/* Tarjetas */
section.tab{display:none;padding-top:14px}
section.tab.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2,.h2{font-family:var(--serif);font-size:1.28rem;font-weight:700;margin-bottom:4px}
.card h3{font-size:1rem;font-weight:700}
.kick{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin:4px 4px 8px}
.mu{color:var(--mu)} .sm{font-size:.84rem} .xs{font-size:.74rem}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.hr{height:1px;background:var(--line);margin:12px 0}
.count{font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--card2);color:var(--mu);border:1px solid var(--line2)}

/* Hero */
.hero{position:relative;border-radius:26px;overflow:hidden;min-height:205px;padding:16px 18px 14px;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--line);background-size:cover;background-position:center}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 25%,rgba(6,14,10,.78) 100%);z-index:0}
.hero>*{position:relative;z-index:1}
.hero .big{position:absolute;right:14px;top:30px;font-size:5.4rem;opacity:.9;filter:drop-shadow(0 6px 18px rgba(0,0,0,.4));z-index:0}
.hero .sinh{position:absolute;left:16px;top:56px;font-size:2.5rem;opacity:.13;font-weight:700;z-index:0;white-space:nowrap}
.hero .tl{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;z-index:2}
.glass{background:rgba(14,26,20,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:6px 13px;font-size:.8rem;font-weight:600}
.hero .badge{align-self:flex-start;background:var(--gold);color:#0E1A14;font-weight:700;font-size:.68rem;letter-spacing:.06em;padding:4px 10px;border-radius:99px;margin-bottom:8px;text-transform:uppercase}
.hero h2{font-family:var(--serif);font-size:2.15rem;font-weight:700;line-height:1;color:#fff}
.hero .date{color:#F2E8D5;opacity:.92;margin-top:4px}
.hero .meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:.8rem;font-weight:600;color:#fff;opacity:.92}

/* Tira de días */
.strip{display:flex;gap:4px;overflow-x:auto;padding:10px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.dd{flex:none;width:46px;padding:7px 0 8px;border-radius:14px;text-align:center;scroll-snap-align:center}
.dd .w{font-size:.62rem;font-weight:700;text-transform:uppercase;color:var(--mu2)}
.dd .n{font-size:1.25rem;font-weight:700;line-height:1.2}
.dd .dot{width:6px;height:6px;border-radius:50%;margin:3px auto 0}
.dd.on{background:var(--gold)} .dd.on .w,.dd.on .n{color:#0E1A14}
.dd.hoy:not(.on){box-shadow:inset 0 0 0 1.5px var(--gold)}

/* Agenda */
.dayhd{display:flex;gap:12px;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid var(--line)}
.dnum{flex:none;width:46px;border-radius:12px;background:var(--gold);color:#0E1A14;text-align:center;padding:4px 0;font-weight:800;line-height:1.05}
.dnum small{display:block;font-size:.55rem;letter-spacing:.08em;text-transform:uppercase}
.dnum b{font-size:1.25rem}
.tipo{font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:rgba(111,183,214,.16);color:var(--blue);white-space:nowrap}
.wx{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--mu);margin-top:6px}
.it{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2);position:relative}
.it:last-of-type{border-bottom:0}
.it .h{flex:none;width:50px;text-align:right;font-weight:700;font-size:.92rem;padding-top:8px;font-variant-numeric:tabular-nums}
.it .h small{display:block;font-weight:500;font-size:.68rem;color:var(--mu2)}
.it .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:1.3rem;border:1px solid var(--line2)}
.it .tx{flex:1;min-width:0;padding-top:2px}
.it .tx b{display:block;font-weight:700;line-height:1.25}
.it .tx p{color:var(--mu);font-size:.85rem;margin-top:3px}
.it.done .tx b{text-decoration:line-through;opacity:.55} .it.done .ic{opacity:.45}
.it.now{background:linear-gradient(90deg,rgba(200,151,58,.12),transparent);border-radius:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tag{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--mu);border:1px solid var(--line2)}
.tag.reservado{background:rgba(127,203,149,.14);color:var(--ok);border-color:rgba(127,203,149,.3)}
.tag.pagado{background:rgba(111,183,214,.15);color:var(--blue);border-color:rgba(111,183,214,.3)}
.tag.pendiente{background:rgba(224,122,85,.15);color:var(--bad);border-color:rgba(224,122,85,.35)}
.tag.precio{color:var(--gold2);border-color:rgba(200,151,58,.3)}
a.tag{cursor:pointer}
.chk{flex:none;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--mu2);display:grid;place-items:center;margin-top:9px}
.chk.on{background:var(--gold);border-color:var(--gold)}
.chk.on::after{content:"";width:6px;height:11px;border:solid #0E1A14;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:13px;background:var(--card2);border:1px solid var(--line2);font-weight:600;font-size:.86rem}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#0E1A14;font-weight:700}
.btn.full{width:100%}
.btn.dash{background:transparent;border:1.5px dashed var(--line2);color:var(--mu);width:100%;margin-top:8px}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:12px}
.lnk{display:block;text-align:center;color:var(--gold2);font-weight:600;padding:12px;font-size:.9rem}

/* Hotel / reservas */
.addr{background:rgba(200,151,58,.1);border:1px solid rgba(200,151,58,.3);border-radius:13px;padding:10px 12px;color:var(--gold2);font-weight:600;margin:10px 0}
.rc .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.city{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:.74rem;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--mu);border:1px solid var(--line2);white-space:nowrap}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:4px;gap:4px;margin-top:12px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:600;font-size:.86rem;color:var(--mu)}
.seg button.on{background:var(--card2);color:var(--tx);box-shadow:0 1px 0 var(--line)}
.seg.mini{margin-top:0}

/* Viaje */
.mapa{display:block;width:100%;max-width:300px;margin:0 auto}
.mapa .isla{fill:#1B3226;stroke:rgba(232,185,106,.35);stroke-width:1}
.mapa text{font-family:var(--sans);font-size:9px;font-weight:700;fill:var(--tx)}
.mapa .si{font-size:7px;fill:var(--mu);font-weight:400}
.leg{display:flex;justify-content:center;gap:18px;color:var(--mu);font-size:.78rem;margin-top:6px}
.stop{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line2)}
.stop:last-child{border-bottom:0}
.stop .num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#0E1A14;font-size:.9rem}
.stop .pic{flex:none;width:62px;height:62px;border-radius:14px;display:grid;place-items:center;font-size:1.9rem;background-size:cover;background-position:center}
.chipsm{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chipsm span{font-size:.72rem;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--mu);border:1px solid var(--line2)}

/* Gastos */
.amt{display:flex;align-items:center;gap:10px}
.amt input{flex:1;min-width:0;background:transparent;border:0;font-size:2.4rem;font-weight:700;outline:none;font-family:var(--serif)}
.amt input::placeholder{color:var(--mu2)}
.inp{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:13px;padding:12px 14px;outline:none;margin-top:10px}
.inp:focus{border-color:var(--gold)}
textarea.inp{min-height:96px;resize:vertical}
.cats{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.cats button{padding:7px 13px;border-radius:99px;border:1px solid var(--line2);font-weight:600;font-size:.84rem;color:var(--mu)}
.cats button.on{background:var(--gold);color:#0E1A14;border-color:var(--gold)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:var(--bg2);border:1px solid var(--line2);border-radius:15px;padding:12px}
.stat b{display:block;font-size:1.35rem;font-family:var(--serif)}
.bar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.gx{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.gx:last-child{border-bottom:0}
.gx .ic{width:36px;height:36px;border-radius:11px;background:var(--card2);display:grid;place-items:center;flex:none}

/* Kit */
.todo{display:flex;gap:12px;padding:12px;border-radius:16px;background:var(--bg2);border:1px solid var(--line2);margin-top:8px}
.todo.done{opacity:.55} .todo.done b{text-decoration:line-through}
.todo.urg{border-color:rgba(224,122,85,.45);background:rgba(224,122,85,.07)}
.todo .chk{margin-top:0}
.prog{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--gold)}
.chkrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.chkrow .chk{margin-top:0}
.chkrow.done span{text-decoration:line-through;opacity:.55}
.sos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sos a{border-radius:16px;padding:14px;border:1px solid;display:block}
.sos b{font-size:1.7rem;font-family:var(--serif);display:block;line-height:1.1}
.sos span{font-size:.8rem;font-weight:600}
.fr{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2)}
.fr:last-child{border-bottom:0}
.fr .s{text-align:right}
.fr .s b{display:block;font-size:1.05rem}
.fr .s i{font-size:.78rem;color:var(--gold2)}
.ap{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.ap:last-child{border-bottom:0}
.ap .ic{font-size:1.5rem;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--card2);flex:none}
.hint{background:rgba(200,151,58,.1);border:1px solid rgba(200,151,58,.3);color:var(--gold2);border-radius:16px;padding:12px 14px;font-size:.88rem;margin-bottom:14px}

/* Navegación inferior */
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,26,20,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav.bot .in{display:flex;max-width:640px;margin:0 auto;gap:4px}
nav.bot button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:14px;font-size:.7rem;font-weight:600;color:var(--mu2)}
nav.bot svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bot button.on{color:var(--gold2);background:rgba(200,151,58,.12)}

/* Diálogo */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg2);border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 12px}
.sheet label{display:block;font-size:.76rem;font-weight:700;color:var(--mu);margin-top:12px}
.sheet label .inp{margin-top:5px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--gold);color:#0E1A14;font-weight:700;padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;z-index:60;pointer-events:none;font-size:.88rem}
.toast.on{opacity:1;transform:translateX(-50%)}
.foot{text-align:center;color:var(--mu2);font-size:.75rem;padding:8px 20px 20px}
@media (min-width:700px){.hero{min-height:240px}}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;margin-left:6px;color:var(--mu2)}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sync.ok{color:var(--ok)} .sync.wait{color:var(--warn)} .sync.bad{color:var(--bad)} .sync.off{color:var(--mu2)}

</style>
</head>
<body>
<header class="top">
  <div class="hd">
    <img class="logo" src="icon-180.png" alt="">
    <div class="sp"><h1>Sri <em>Lanka</em> <span class="pill" id="pill"></span></h1><div class="sub">1 – 15 nov 2026 <span class="sync" id="sync"></span></div></div>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main class="wrap">
  <section class="tab" id="s-hoy"></section>
  <section class="tab" id="s-viaje"></section>
  <section class="tab" id="s-reservas"></section>
  <section class="tab" id="s-gastos"></section>
  <section class="tab" id="s-kit"></section>
</main>
<button id="nueva" class="pill" hidden onclick="location.reload()" style="position:fixed;top:calc(80px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;padding:8px 14px;background:var(--gold);color:#0E1A14">Hay una versión nueva · tocar para actualizar</button>
<nav class="bot"><div class="in">
  <button data-tab="hoy"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
  <button data-tab="viaje"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Viaje</button>
  <button data-tab="reservas"><svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 5v12" stroke-dasharray="2 2"/></svg>Reservas</button>
  <button data-tab="gastos"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>Gastos</button>
  <button data-tab="kit"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M12 11v5M9.5 13.5h5"/></svg>Kit</button>
</div></nav>
<dialog id="dlg"><div class="sheet" id="dlgB"></div></dialog>

const fCorta = s => { const d = dISO(s); return `${d.getUTCDate()} ${MES[d.getUTCMonth()].slice(0, 3)}`; };

/* Salida y puesta de sol (ecuación solar estándar) en hora de Sri Lanka */
function sol(f, lat, lon) {
  const rad = Math.PI / 180, J = dISO(f).getTime() / 86400000 + 2440587.5 + 0.5;
  const n = Math.round(J - 2451545 + 0.0008), Js = n - lon / 360;
  const M = (357.5291 + 0.98560028 * Js) % 360;
  const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const L = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545 + Js + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);
  const dec = Math.asin(Math.sin(L * rad) * Math.sin(23.4397 * rad));
  const w = Math.acos((Math.sin(-0.833 * rad) - Math.sin(lat * rad) * Math.sin(dec)) / (Math.cos(lat * rad) * Math.cos(dec))) / rad;
  const aHora = j => { const d = new Date((j - 2440587.5) * 86400000 + SL_OFF * 60000); return hm(d.getUTCHours() * 60 + d.getUTCMinutes()); };
  return [aHora(Jt - w / 360), aHora(Jt + w / 360)];
}

/* Documentos adjuntos (IndexedDB, solo en este móvil) */
const DB = { db: null,
  open() { return this.db ? Promise.resolve(this.db) : new Promise((ok, ko) => { const q = indexedDB.open("sl-docs", 1); q.onupgradeneeded = () => q.result.createObjectStore("f"); q.onsuccess = () => ok(this.db = q.result); q.onerror = () => ko(q.error); }); },
  async get(k) { const db = await this.open(); return new Promise(ok => { const q = db.transaction("f").objectStore("f").get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); }); },
  async put(k, v) { const db = await this.open(); return new Promise((ok, ko) => { const t = db.transaction("f", "readwrite"); t.objectStore("f").put(v, k); t.oncomplete = ok; t.onerror = () => ko(t.error); }); },
  async del(k) { const db = await this.open(); return new Promise(ok => { const t = db.transaction("f", "readwrite"); t.objectStore("f").delete(k); t.oncomplete = ok; }); }
};
async function docs(id, titulo) {
  const f = await DB.get(id).catch(() => null);
  abrir(`<h2 class="h2">${esc(titulo)}</h2><p class="mu sm">Foto o PDF guardado solo en este móvil. Se abre sin conexión.</p>
    ${f ? `<div class="hint" style="margin-top:12px">📎 ${esc(f.name)}</div><div class="btns"><button class="btn pri" id="dV">Abrir</button><button class="btn" id="dB">Quitar</button></div>` : ""}
    <div class="btns"><label class="btn ${f ? "" : "pri"}" style="margin:0;color:inherit">${f ? "Cambiar archivo" : "Adjuntar archivo"}<input type="file" id="dF" accept="image/*,application/pdf" hidden></label></div>`);
  $("#dF").onchange = async e => { const x = e.target.files[0]; if (!x) return; await DB.put(id, { name: x.name, type: x.type, blob: x }); toast("Adjuntado"); cerrar(); };
  if (f) {
    $("#dV").onclick = () => { const u = URL.createObjectURL(f.blob); window.open(u, "_blank") || (location.href = u); };
    $("#dB").onclick = async () => { await DB.del(id); toast("Quitado"); cerrar(); };
  }
}

const CATS = [["comida", "Comida", "🍛"], ["transporte", "Transporte", "🛺"], ["actividades", "Actividades", "🎟️"], ["alojamiento", "Alojamiento", "🏠"], ["compras", "Compras", "🛍️"], ["otros", "Otros", "✨"]];

  const pag = [0, 1].map(i => st.gastos.filter(x => x.pago === i).reduce((s, x) => s + x.eur, 0)) , comp = st.gastos.filter(x => x.pago === 2).reduce((s, x) => s + x.eur, 0);

    ${porCat.map(([t, e, v]) => `<div style="margin-top:12px"><div class="row sm"><span>${e} ${t}</span><span class="sp"></span><b>${eur(v)}</b></div><div class="bar"><i style="width:${(v / tot * 100).toFixed(1)}%"></i></div></div>`).join("")}

  if (st.gastos.length) {

  $("#preI").onchange = e => { st.ppto = parseFloat(e.target.value.replace(",", ".")) || 0; guardar("ppto"); gastos(); };

      <div class="card"><h2>Tipo de cambio</h2><p class="mu sm">1 € = ${num(st.cambio.LKR)} LKR · 1 € = ${num(st.cambio.USD)} $ (${fCorta(st.cambio.fecha)}). Se actualiza solo cuando hay conexión.</p></div>
      <div class="card"><h2>Empezar de cero</h2><p class="mu sm">Borra lo guardado en este móvil. Si la sincronización está activa, se vuelve a descargar lo que hay en la nube.</p><button class="btn full" id="bReset" style="margin-top:10px;color:var(--bad)">Borrar datos</button></div>`;
  }
  $("#s-kit").innerHTML = html;
  syncCardEventos();
  const seg = $("#segT"); if (seg) seg.oninput = e => { st.seguro = e.target.value; guardar("seguro"); };
  [0, 1].forEach(i => { const el = $("#n" + i); if (el) el.onchange = e => { st.nombres[i] = e.target.value.trim() || ["Javi", "Pareja"][i]; guardar("nombres"); toast("Guardado"); }; });
  const ex = $("#bExp"); if (ex) ex.onclick = () => { const o = {}; Object.keys(localStorage).filter(k => k.startsWith("sl-")).forEach(k => o[k] = localStorage.getItem(k)); descargar("sri-lanka-copia.json", JSON.stringify(o), "application/json"); };
  const im = $("#bImp"); if (im) im.onchange = async e => { try { const o = JSON.parse(await e.target.files[0].text()); Object.entries(o).forEach(([k, v]) => k.startsWith("sl-") && !["sl-codigo", "sl-cola", "sl-desde"].includes(k) && localStorage.setItem(k, v)); LS.set("subirTodo", true); location.reload(); } catch (err) { toast("Archivo no válido"); } };
  const rs = $("#bReset"); if (rs) rs.onclick = () => { if (confirm("¿Borrar todos los datos de este móvil?")) { Object.keys(localStorage).filter(k => k.startsWith("sl-") && k !== "sl-codigo").forEach(k => localStorage.removeItem(k)); location.reload(); } };
}

/* ============================ diálogo y acciones ============================ */
function abrir(html) { $("#dlgB").innerHTML = `<div class="grab"></div>` + html; const d = $("#dlg"); if (!d.open) d.showModal(); $(".sheet").scrollTop = 0; }
function cerrar() { const d = $("#dlg"); if (d.open) d.close(); }
function descargar(nombre, txt, tipo) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + txt], { type: tipo })); a.download = nombre; a.click(); }
function irTab(t) {
  tab = t; LS.set("tab", t);
  document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("on", s.id === "s-" + t));
  document.querySelectorAll("nav.bot button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  pintar(); scrollTo(0, 0);
}
function pintar() { cabecera(); ({ hoy, viaje, reservas, gastos, kit })[tab](); }

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-dia],[data-parada],[data-hecho],[data-add],[data-delx],[data-share],[data-guia],[data-irdia],[data-restab],[data-estado],[data-editres],[data-docver],[data-doc],[data-mon],[data-cat],[data-pago],[data-delg],[data-kittab],[data-todo],[data-equip],[data-frase],[data-go],[data-cerrar],[data-activar]");
  if (!t) { if (e.target.id === "dlg") cerrar(); return; }
  const ds = t.dataset;
  if (ds.tab) irTab(ds.tab);
  else if (ds.go) { if (ds.kit) kitTab = ds.kit; irTab(ds.go); }
  else if (ds.dia != null) { diaSel = +ds.dia; pintar(); }
  else if (ds.parada) { diaSel = DIAS.findIndex(d => d.p === ds.parada); if (tab !== "hoy") irTab("hoy"); else pintar(); }
  else if (ds.hecho) { st.hechos[ds.hecho] = !st.hechos[ds.hecho]; if (!st.hechos[ds.hecho]) delete st.hechos[ds.hecho]; guardar("hechos"); hoy(); }
  else if (ds.add) nuevoItem(ds.add);
  else if (ds.delx) { const [f, x] = [ds.delx.slice(0, 10), +ds.delx.split("-x")[1]]; st.extra[f].splice(x, 1); guardar("extra"); hoy(); }
  else if (ds.share) compartir(+ds.share);
  else if (ds.irdia != null) { cerrar(); diaSel = +ds.irdia; irTab("hoy"); }
  else if (ds.guia) guia(ds.guia);
  else if (ds.restab) { resTab = ds.restab; reservas(); }
  else if (ds.estado) { const r = resDe([...RESERVAS.transporte, ...RESERVAS.actividades].find(x => x.id === ds.estado)); const nx = ESTADOS[(ESTADOS.indexOf(r.estado) + 1) % ESTADOS.length]; st.res[ds.estado] = { ...(st.res[ds.estado] || {}), estado: nx }; guardar("res"); reservas(); }
  else if (ds.editres) editarRes(ds.editres);
  else if (ds.docver) { const r = [...RESERVAS.hoteles, ...RESERVAS.transporte, ...RESERVAS.actividades].find(x => x.id === ds.docver); docs("res-" + r.id, r.nombre); }
  else if (ds.doc) docs(ds.doc, ds.tit);
  else if (ds.mon) { g.mon = ds.mon; LS.set("gmon", g.mon); [...$("#gM").children].forEach(b => b.classList.toggle("on", b === t)); $("#gI").dispatchEvent(new Event("input")); }
  else if (ds.cat) { g.cat = ds.cat; [...$("#gK").children].forEach(b => b.classList.toggle("on", b === t)); }
  else if (ds.pago != null) { g.pago = +ds.pago; [...$("#gP").children].forEach(b => b.classList.toggle("on", b === t)); }
  else if (ds.delg) { if (confirm("¿Borrar este gasto?")) { st.gastos = st.gastos.filter(x => x.id !== ds.delg); guardar("gastos"); gastos(); } }
  else if (ds.kittab) { kitTab = ds.kittab; kit(); }
  else if (ds.todo) { st.todo[ds.todo] = !st.todo[ds.todo]; guardar("todo"); tab === "hoy" ? hoy() : kit(); }
  else if (ds.equip != null) { st.equip[ds.equip] = !st.equip[ds.equip]; guardar("equip"); kit(); }
  else if (ds.frase != null) { const f = FRASES[+ds.frase]; try { const u = new SpeechSynthesisUtterance(f.si); u.lang = /[஀-௿]/.test(f.si) ? "ta-LK" : "si-LK"; speechSynthesis.speak(u); } catch (err) {} abrir(`<div style="text-align:center;padding:20px 0"><div class="mu">${esc(f.es)}</div><div style="font-size:2.6rem;font-weight:700;margin:16px 0">${esc(f.si)}</div><div style="color:var(--gold2);font-size:1.2rem">${esc(f.r)}</div></div>`); }
  else if ("cerrar" in ds) cerrar();
  else if ("activar" in ds) { const v = $("#hCod").value; if (v.trim().length < 10) { toast("Código no válido"); return; } Sync.activar(v); await Sync.ya(); toast(Sync.error === "codigo" ? "Código incorrecto" : "Sincronización activada"); if (Sync.error === "codigo") Sync.desactivar(); pintar(); }
});
function nuevoItem(f) {
  abrir(`<h2 class="h2">Añadir a la agenda</h2><div class="mu sm">${fLarga(f)}</div>
    <label>Hora<input class="inp" id="aH" type="time"></label>
    <label>Qué<input class="inp" id="aQ" placeholder="Ej. Cena en…"></label>
    <label>Notas<input class="inp" id="aD" placeholder="Opcional"></label>
    <label>Lugar para el mapa<input class="inp" id="aM" placeholder="Opcional: nombre del sitio"></label>
    <div class="btns"><button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="aOk">Añadir</button></div>`);
  $("#aOk").onclick = () => {
    const q = $("#aQ").value.trim(); if (!q) { toast("Escribe qué"); return; }
    (st.extra[f] = st.extra[f] || []).push({ t: $("#aH").value, e: "📌", q, d: $("#aD").value.trim(), m: $("#aM").value.trim() || undefined });
    guardar("extra"); cerrar(); hoy(); toast("Añadido");
  };
}
function compartir(i) {
  const D = DIAS[i], P = parada(D.p);
  const extra = (st.extra[D.f] || []);
  const txt = `${P.emoji} ${fLarga(D.f)} · ${P.nombre}\n${D.tit}\n\n` + [...D.items, ...extra].sort((a, b) => (a.t || "99").localeCompare(b.t || "99")).map(it => `${it.t || "--:--"} ${it.e || ""} ${it.q}`).join("\n");
  if (navigator.share) navigator.share({ title: "Plan del día", text: txt }).catch(() => {});
  else navigator.clipboard?.writeText(txt).then(() => toast("Copiado"));
}

/* ============================ tiempo y cambio ============================ */
const WX = c => c === 0 ? "☀️" : c <= 2 ? "🌤️" : c === 3 ? "☁️" : c <= 48 ? "🌫️" : c <= 57 ? "🌦️" : c <= 67 ? "🌧️" : c <= 82 ? "🌦️" : "⛈️";
function wxIco(c) { return c == null ? "" : WX(c); }
async function actualizarTiempo() {
  const ult = LS.get("tiempoTs", 0); if (Date.now() - ult < 3 * 3600e3) return;
  try {
    const lat = PARADAS.map(p => p.lat).join(","), lon = PARADAS.map(p => p.lon).join(",");
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FColombo&forecast_days=16`);
    const arr = [].concat(await r.json());
    arr.forEach((o, i) => {
      const dias = {};
      (o.daily?.time || []).forEach((f, j) => dias[f] = { code: o.daily.weather_code[j], max: o.daily.temperature_2m_max[j], min: o.daily.temperature_2m_min[j], rain: o.daily.precipitation_probability_max[j] });
      st.tiempo[PARADAS[i].id] = { now: o.current?.temperature_2m, code: o.current?.weather_code, dias };
    });
    guardar("tiempo"); LS.set("tiempoTs", Date.now());
    if (tab === "hoy") hoy();
  } catch (e) {}
}
async function actualizarCambio() {
  if (st.cambio.fecha === hoyISO() && st.cambio.fuente !== "referencia") return;
  try {
    const r = await (await fetch("https://open.er-api.com/v6/latest/EUR")).json();
    if (r.rates?.LKR && r.rates?.USD) { st.cambio = { LKR: r.rates.LKR, USD: r.rates.USD, fecha: hoyISO(), fuente: "api" }; guardar("cambio"); if (tab === "gastos") gastos(); }
  } catch (e) {}
}


/* ============================ sincronización (Supabase) ============================
   Todo se guarda primero en el móvil. Los cambios van a una cola que se envía cuando hay
   conexión; cada 20 s (con la app abierta) se descargan los cambios del otro móvil.
   Para leer o escribir hace falta el código del viaje, que llega en el enlace (#c=...). */
const NUBE = { url: "https://joirhbutezhhcfohkfui.supabase.co/rest/v1/rpc/", key: "sb_publishable_ER8_8aV6QDONzHrXinTz1g_Z2lRFvvG" };
const MAPA_SYNC = { hechos: "hecho", extra: "extra", diario: "diario", res: "res", todo: "todo", equip: "equip", gastos: "gasto", ppto: "ajuste", seguro: "ajuste", nombres: "ajuste" };
const AJUSTES = ["ppto", "seguro", "nombres"];

function filasDe(k) {                         // estado -> { id: valor }
  const v = st[k];
  if (k === "gastos") return Object.fromEntries(v.map(x => [x.id, x]));
  if (AJUSTES.includes(k)) return { [k]: v };
  return { ...v };
}
const Sync = {
  codigo: LS.get("codigo", ""), cola: LS.get("cola", []), desde: LS.get("desde", null),
  snap: {}, enviando: false, error: "", ultima: LS.get("ultima", 0), t: null,

  iniciar() {
    const m = location.hash.match(/c=([a-z0-9-]{10,})/i);
    if (m) this.activar(m[1]);           // el enlace se queda con el código, por si lo añadís a la pantalla de inicio
    for (const k in MAPA_SYNC) this.snap[k] = JSON.parse(JSON.stringify(filasDe(k)));
    if (LS.get("subirTodo", false)) { this.subirTodo(); LS.set("subirTodo", false); }
    addEventListener("online", () => this.ya());
    document.addEventListener("visibilitychange", () => { if (!document.hidden) this.ya(); });
    setInterval(() => { if (!document.hidden) this.ya(); }, 20000);
    this.ya();
  },
  activar(c) {
    c = c.trim().toLowerCase();
    if (c === this.codigo) return;
    this.codigo = c; LS.set("codigo", c); this.desde = null; LS.set("desde", null); this.error = "";
    this.subirTodo();
  },
  desactivar() { this.codigo = ""; LS.set("codigo", ""); this.cola = []; LS.set("cola", []); this.desde = null; LS.set("desde", null); this.pintarEstado(); },
  subirTodo() {                                 // lo que ya hubiera en este móvil se suma a la nube
    const porDefecto = { ppto: 0, seguro: "", nombres: ["Javi", "Pareja"] };       // no pisar lo que ya haya puesto el otro móvil
    for (const k in MAPA_SYNC) {
      if (AJUSTES.includes(k) && JSON.stringify(st[k]) === JSON.stringify(porDefecto[k])) continue;
      const f = filasDe(k); for (const id in f) if (f[id] !== false && f[id] !== "") this.encolar(MAPA_SYNC[k], id, f[id], false);
    }
  },
  encolar(tipo, id, valor, borrado) {
    this.cola = this.cola.filter(o => !(o.tipo === tipo && o.id === id));
    this.cola.push({ tipo, id: String(id), valor: borrado ? null : valor, borrado, v: Date.now() + Math.random() });
    LS.set("cola", this.cola);
  },
  cambio(k) {                                  // llamado desde guardar(k): manda solo lo que ha cambiado
    if (!MAPA_SYNC[k]) return;
    const prev = this.snap[k] || {}, cur = filasDe(k);
    for (const id of new Set([...Object.keys(prev), ...Object.keys(cur)])) {
      const a = JSON.stringify(prev[id]), b = JSON.stringify(cur[id]);
      if (a !== b) this.encolar(MAPA_SYNC[k], id, cur[id], !(id in cur));
    }
    this.snap[k] = JSON.parse(JSON.stringify(cur));
    this.pintarEstado();
    clearTimeout(this.t); this.t = setTimeout(() => this.ya(), 1200);
  },
  async rpc(fn, body) {
    const r = await fetch(NUBE.url + fn, { method: "POST", headers: { apikey: NUBE.key, Authorization: "Bearer " + NUBE.key, "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) { const t = await r.text(); throw new Error(/codigo_incorrecto/.test(t) ? "codigo" : "http " + r.status); }
    return r.json();
  },
  async ya() {
    if (!this.codigo || this.enviando || navigator.onLine === false) { this.pintarEstado(); return; }
    this.enviando = true;
    try {
      while (this.cola.length) {
        const lote = this.cola.slice(0, 200);
        await this.rpc("sl_guardar", { p_codigo: this.codigo, p_filas: lote.map(({ tipo, id, valor, borrado }) => ({ tipo, id, valor, borrado })) });
        const enviados = new Set(lote.map(o => o.v));
        this.cola = this.cola.filter(o => !enviados.has(o.v)); LS.set("cola", this.cola);
      }
      const filas = await this.rpc("sl_leer", { p_codigo: this.codigo, p_desde: this.desde });
      if (filas.length) { this.aplicar(filas); this.desde = filas[filas.length - 1].actualizado; LS.set("desde", this.desde); }
      this.error = ""; this.ultima = Date.now(); LS.set("ultima", this.ultima);
    } catch (e) { this.error = e.message === "codigo" ? "codigo" : "red"; }
    this.enviando = false; this.pintarEstado();
  },
  aplicar(filas) {
    const tocados = new Set();
    const k2 = { hecho: "hechos", extra: "extra", diario: "diario", res: "res", todo: "todo", equip: "equip", gasto: "gastos" };
    for (const f of filas) {
      if (this.cola.some(o => o.tipo === f.tipo && o.id === f.id)) continue;        // lo de este móvil aún no enviado manda
      let k;
      if (f.tipo === "ajuste") { if (!AJUSTES.includes(f.id) || f.borrado) continue; k = f.id; st[k] = f.valor; }
      else if (f.tipo === "gasto") { k = "gastos"; st.gastos = st.gastos.filter(x => x.id !== f.id); if (!f.borrado && f.valor) st.gastos.push(f.valor); }
      else if (k2[f.tipo]) { k = k2[f.tipo]; if (f.borrado) delete st[k][f.id]; else st[k][f.id] = f.valor; }
      else continue;
      tocados.add(k);
    }
    if (!tocados.size) return;
    tocados.forEach(k => { LS.set(k, st[k]); this.snap[k] = JSON.parse(JSON.stringify(filasDe(k))); });
    const escribiendo = ["TEXTAREA", "INPUT"].includes(document.activeElement?.tagName);
    if (!$("#dlg").open && !escribiendo) pintar();
  },
  pintarEstado() {
    const el = $("#sync"); if (!el) return;
    let t = "", c = "";
    if (!this.codigo) { t = "Solo en este móvil"; c = "off"; }
    else if (this.error === "codigo") { t = "Código incorrecto"; c = "bad"; }
    else if (navigator.onLine === false || this.error === "red") { t = this.cola.length ? `Sin conexión · ${this.cola.length} por enviar` : "Sin conexión"; c = "off"; }
    else if (this.cola.length) { t = `Enviando ${this.cola.length}…`; c = "wait"; }
    else { t = "Sincronizado"; c = "ok"; }
    el.textContent = t; el.className = "sync " + c;
    const d = $("#syncDet"); if (d) d.textContent = t + (this.ultima && this.codigo ? ` · última vez ${new Date(this.ultima).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" })}` : "");
  }
};
function enlaceViaje() { return location.origin + location.pathname + "#c=" + Sync.codigo; }
function syncCardHTML() {
  return `<div class="card"><h2>Compartir entre móviles</h2>
    ${Sync.codigo ? `<p class="mu sm">Gastos, diario, marcas, notas y reservas se guardan también en la nube y se ven en los dos móviles. Las fotos y PDFs adjuntos se quedan solo en cada móvil.</p>
      <div class="hint" style="margin:12px 0 0" id="syncDet"></div>
      <div class="btns"><button class="btn pri" id="sShare">Enviar enlace a ${esc(st.nombres[1])}</button><button class="btn" id="sAhora">Sincronizar ahora</button></div>
      <button class="btn full" id="sOff" style="margin-top:8px;color:var(--mu)">Desactivar en este móvil</button>`
    : `<p class="mu sm">Ahora todo se guarda solo en este móvil. Abre el enlace del viaje (el que lleva <b>#c=</b> al final) o pega aquí el código.</p>
      <input class="inp" id="sCod" placeholder="Código del viaje" autocapitalize="off" autocomplete="off">
      <button class="btn pri full" id="sOn" style="margin-top:10px">Activar</button>`}</div>`;
}
function syncCardEventos() {
  Sync.pintarEstado();
  const on = $("#sOn"); if (on) on.onclick = () => { const v = $("#sCod").value; if (v.trim().length < 10) { toast("Código no válido"); return; } Sync.activar(v); Sync.ya().then(() => { toast(Sync.error === "codigo" ? "Código incorrecto" : "Sincronización activada"); if (Sync.error === "codigo") Sync.desactivar(); kit(); }); };
  const sh = $("#sShare"); if (sh) sh.onclick = () => {
    const txt = `Nuestra app del viaje a Sri Lanka. Ábrelo en el móvil y añádelo a la pantalla de inicio: ${enlaceViaje()}`;
    if (navigator.share) navigator.share({ title: "Sri Lanka 2026", text: txt }).catch(() => {}); else navigator.clipboard?.writeText(enlaceViaje()).then(() => toast("Enlace copiado"));
  };
  const ah = $("#sAhora"); if (ah) ah.onclick = () => Sync.ya().then(() => toast(Sync.error ? "No se ha podido" : "Al día"));
  const off = $("#sOff"); if (off) off.onclick = () => { if (confirm("Este móvil dejará de compartir los cambios. Lo ya guardado se queda aquí.")) { Sync.desactivar(); kit(); } };
}

/* ============================ arranque ============================ */
Sync.iniciar();
irTab(["hoy", "viaje", "reservas", "gastos", "kit"].includes(tab) ? tab : "hoy");
setInterval(() => { if (tab === "hoy" && !$("#dlg").open && document.activeElement?.id !== "diarioT") hoy(); }, 60000);
actualizarTiempo(); actualizarCambio();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => { if (e.data?.tipo === "nueva") { const b = $("#nueva"); b.hidden = false; } });
}
